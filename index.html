<script>
  // Corrige a altura real da viewport em navegadores mobile (a barra de
  // endereço some/aparece durante o scroll e "dvh" nem sempre acompanha
  // isso de forma confiável, especialmente em WebViews como WhatsApp/Instagram).
  // window.innerHeight é a fonte mais confiável da área visível real.
  (function () {
    function setViewportHeight() {
      document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    }
    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);
    window.addEventListener('orientationchange', setViewportHeight);
  })();
</script>

<style>

    --bg:#f4f8fe;

    --trio-light:#D0E0EA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html, body{
    margin:0;
    overflow-x:hidden;
    height:100%;
  }
  html{
    overscroll-behavior-y:none; /* evita o bounce elástico do iOS "descentralizar" telas curtas */
  }
  
  body{
    font-family:'Aptos','Segoe UI',Arial,sans-serif;
    color:var(--text);
    min-height: 100vh; /* fallback para navegadores muito antigos */
    min-height: 100dvh; /* melhora em navegadores modernos com suporte completo */
    min-height: calc(var(--vh, 1vh) * 100); /* fonte mais confiável no mobile: calculada via JS */
    display: flex;
    flex-direction: column; /* Ajuda a rolagem fluir de cima para baixo */
    padding: 24px 16px;
    line-height: 1.6;
    overscroll-behavior-y:none;
  }

  /* Truque para travar o fundo no mobile */
  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('https://i.imgur.com/RONOv9W.png') center/cover no-repeat;
    z-index: -1;
  }
  
  .app{
    width:100%;
    max-width:700px;
    margin: auto; /* Centraliza a capa perfeitamente quando não tem muita altura */
    flex-shrink: 0; /* Impede que o card encolha, deixando você rolar até a última vírgula */

  .brandbar{
    display:flex;
    justify-content:flex-start;
    align-items:center;
    margin-bottom:24px;
  }
  .brandbar img{
    height:32px;
    width:auto;
    display:block;
  }
  .card{
    background:#ffffff;
    border-radius:14px;
    overflow:hidden;
  }
  .cover-image-wrap{
    width:100%;
    overflow:hidden;
    line-height:0;
  }
  .cover-image{
    display:block;
    width:100%;
    height:auto;
  }
  .section-pad{
    padding:40px 36px;
  }
  @media (max-width:600px){
    .section-pad{padding:28px 22px;}
  }
  #screen-cover{
    padding:0 0 40px;
  }
  #screen-cover .cover-content{
    padding:28px 36px 0;
  }
  @media (max-width:600px){
    #screen-cover{padding:0 0 28px;}
    #screen-cover .cover-content{padding:22px 22px 0;}
  }
  h1{
    font-family:'Raleway',sans-serif;

    font-size:30px;
    color:var(--blue-dark);

    font-weight:700;
    font-size:20px;
    color:var(--blue-dark);
    margin-bottom:16px;
  }

    font-size:16px;
    color:var(--text);
    margin-bottom:28px;
  }
  .lead{
    font-size:15px;
    color:var(--text);
    margin-bottom:14px;
  }

  .situacao-label{

    font-weight:700;
    font-size:18px;

    font-weight:700;

    border:none;

    text-align:center;

  .btn-primary{
    background:var(--blue);
    color:#ffffff;
  }
  .btn-primary:active{background:var(--blue-dark);}
  .btn-ghost{
    background:transparent;
    color:var(--blue);
    border:1.5px solid var(--blue);
  }
  .btn-ghost:active{background:var(--blue-light);}
  .row-left{display:flex;justify-content:flex-start;}
  .row-right{display:flex;justify-content:flex-end;}
  .row-between{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}

  .options{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option-btn{
    text-align:left;

    font-size:15px;

  .reflection p:last-child{margin-bottom:0;}

    .restart-link{
    display:inline-block;
    margin-top:26px;
    font-size:13px;
    color:var(--trio-mid);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    font-family:'Aptos','Segoe UI',Arial,sans-serif;

  @media (hover:hover) and (pointer:fine){

    .btn-ghost:hover{background:var(--blue-light);}
    .option-btn:hover{

  .hidden{display:none;}
</style>
</head>

// ---------- Navegação ----------
let historyStack = [];

function goTo(screenId){
  document.querySelectorAll('.card > section').forEach(s => s.classList.add('hidden'));
  document.getElementById(screenId).classList.remove('hidden');
}

function startStory(){
  historyStack = [];
  renderNode("1");
  goTo('screen-story');
}

function paragraphsHTML(str){
  return str.split('\n\n').map(p => `<p class="lead">${p.replace(/\n/g,'<br>')}</p>`).join('');
}

function renderNode(id){
  if(id === "END"){
    showEnding("Obrigado(a) por participar da simulação. Se quiser, recomece para experimentar outras decisões.");
    return;
  }

  // A mágica que faz o "Voltar" funcionar perfeitamente
  if(id === "BACK"){
    historyStack.pop(); // Remove a página de erro atual da memória
    const prevId = historyStack.pop(); // Recupera a página anterior onde a pessoa estava
    renderNode(prevId || "1"); // Renderiza a página anterior
    return;
  }

  const node = nodes[id];
  if(!node){ return; }

  historyStack.push(id); // Salva a tela atual no histórico de navegação

  if(node.ending){
    let html = paragraphsHTML(node.text);
    if(node.reflection){
      html += `<div class="reflection">${paragraphsHTML(node.reflection)}</div>`;
    }
    showEnding(html, true);
    return;
  }

  document.getElementById('story-text').innerHTML = paragraphsHTML(node.text);

  const reflectionEl = document.getElementById('story-reflection');
  if(node.reflection){
    reflectionEl.innerHTML = `<div class="reflection">${paragraphsHTML(node.reflection)}</div>`;
  } else {
    reflectionEl.innerHTML = "";
  }

  const optsEl = document.getElementById('story-options');
  optsEl.innerHTML = "";
  node.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = opt.label;
    btn.onclick = () => renderNode(opt.target);
    optsEl.appendChild(btn);
  });

  goTo('screen-story');
  window.scrollTo({top:0, behavior:'smooth'});
}

function showEnding(html, isRaw){
  document.getElementById('end-text').innerHTML = isRaw ? html : `<p class="lead">${html}</p>`;
  goTo('screen-end');
  window.scrollTo({top:0, behavior:'smooth'});
}

function restart(){
  goTo('screen-cover');
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
